worker_processes 1;
pid /run/nginx-briefing.pid;
error_log /var/log/nginx/briefing-error.log warn;
events { worker_connections 256; }
# Template: replace briefing.example.com with your domain and certificate paths.
# Ensure no other service owns this listener before starting this nginx instance.
http {
    access_log off;
    client_max_body_size 2m;
    limit_req_zone $binary_remote_addr zone=briefing:1m rate=20r/s;
    server {
        listen 0.0.0.0:443 ssl;
        server_name briefing.example.com;
        ssl_certificate /etc/letsencrypt/live/briefing.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/briefing.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /briefing/v1/ {
            limit_req zone=briefing burst=30 nodelay;
            proxy_pass http://127.0.0.1:8786;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            add_header Cache-Control "no-store" always;
        }
        location / { return 404; }
    }
}
