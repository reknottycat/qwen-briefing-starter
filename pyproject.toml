[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-briefing-starter"
version = "0.2.0"
description = "Self-hosted cached news and learning briefings for Qwen glasses"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Qwen Briefing Starter contributors"}]
keywords = ["qwen", "briefing", "agent-skills", "gmail"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.urls]
Repository = "https://github.com/reknottycat/qwen-briefing-starter"
Issues = "https://github.com/reknottycat/qwen-briefing-starter/issues"

[tool.setuptools.packages.find]
include = ["briefing*"]

[tool.setuptools.package-data]
briefing = ["source_policy.json", "management/*.html", "management/*.js", "management/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
